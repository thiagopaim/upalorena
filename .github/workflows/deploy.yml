name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [wordpress_update]
  schedule:
    # Rede de segurança: rebuild a cada hora (UTC)
    - cron: "0 * * * *"

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stamp build
        run: |
          {
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
          } > dist/deploy-stamp.txt
          echo "Arquivos gerados em dist/:"
          find dist -type f | head -50
          echo "--- deploy-stamp.txt ---"
          cat dist/deploy-stamp.txt
          echo "--- index.html (primeiros bytes) ---"
          wc -c dist/index.html
          shasum -a 256 dist/index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # HostGator: o FTP costuma abrir na home da conta, não no site.
          # Padrão: public_html/
          # Se o site não atualizar, teste o secret FTP_SERVER_DIR = ./
          # Se criar public_html/public_html, use FTP_SERVER_DIR = ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          log-level: verbose
          # Nunca mexe na pasta do WordPress
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp/**
            wp/**/**
