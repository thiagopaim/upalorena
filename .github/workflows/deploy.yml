name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [wordpress_update]
  schedule:
    # Rede de segurança: rebuild a cada hora (UTC)
    - cron: "0 * * * *"

concurrency:
  group: deploy-production
  # Nunca cancela upload FTP no meio — evita estado parcial no servidor
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dá tempo do WordPress gravar/limpar cache antes do build ler a API
      - name: Wait for WordPress
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        run: sleep 20

      - name: Build
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build

      - name: Stamp build
        run: |
          {
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
          } > dist/deploy-stamp.txt
          echo "Arquivos gerados em dist/:"
          find dist -type f | head -50
          echo "--- deploy-stamp.txt ---"
          cat dist/deploy-stamp.txt
          echo "--- index.html ---"
          wc -c dist/index.html
          shasum -a 256 dist/index.html

      # O FTP-Deploy só sobe arquivos cujo hash mudou. Se o state remoto estiver
      # desincronizado (ou o build repetir HTML por cache), só o stamp atualiza.
      # Apagar o state força reenvio de tudo em website/.
      - name: Reset FTP sync state
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'website/' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${FTP_SERVER_DIR};
            rm -f .ftp-deploy-sync-state.json;
            bye
          " || echo "State ausente ou falha ao remover — o deploy segue mesmo assim."

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Site estático em public_html/website/ (mascarado na raiz via .htaccess)
          # Secret FTP_SERVER_DIR sobrescreve o padrão se o FTP já abrir em public_html.
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'website/' }}
          log-level: verbose
          # Nunca mexe na pasta do WordPress nem no .htaccess da raiz
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp/**
            wp/**/**
            .htaccess
