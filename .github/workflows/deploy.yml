name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [wordpress_update]
  schedule:
    # Rede de segurança: rebuild a cada hora (UTC)
    - cron: "0 * * * *"

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Se o FTP abrir na home (não em public_html), use: public_html/
          server-dir: ./
          # Nunca apaga a pasta do WordPress nem o estado do sync
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp/**
            wp/**/**
            .ftp-deploy-sync-state.json
